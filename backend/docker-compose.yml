version: '3.9'

services:

  backend:
    build: .
    container_name: agentos-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15

    container_name: agentos-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentos

    ports:
      - "5432:5432"

  redis:
    image: redis:7

    container_name: agentos-redis

    ports:
      - "6379:6379"